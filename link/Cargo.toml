[package]
name = "muse-link"
version = "0.1.0"
edition = "2021"

[dependencies]
rustls = { version = "0.23.45", default-features = false }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc"] }
getrandom = "0.2"
x25519-dalek = { version = "2", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[features]
# Lets the client speak plain HTTP and plain WebSocket to a local fake server.
# Only the test driver in host/ turns this on. It does not build for the PSP.
plaintext-for-tests = []
